<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Herzies icon editor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: #0b0d14;
    color: #e6e6e6;
    display: flex;
    height: 100vh;
  }

  #sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid #2a2d3a;
    overflow-y: auto;
    padding: 8px;
  }
  #sidebar h1 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8b8fa3;
    margin: 4px 4px 10px;
  }
  .item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 8px;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .item-row:hover { background: #171a24; }
  .item-row.selected { background: #1c2030; border-color: #3d4258; }
  .item-row canvas {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
    background: #05060a;
    flex-shrink: 0;
  }

  #main {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }
  #main h2 { margin: 0 0 4px; font-size: 18px; }
  #main .hint { color: #8b8fa3; font-size: 12px; margin-bottom: 20px; }

  #editor {
    display: flex;
    align-items: flex-start;
    gap: 32px;
  }

  #big-grid {
    display: grid;
    grid-template-columns: repeat(16, 28px);
    grid-template-rows: repeat(16, 28px);
    border: 1px solid #2a2d3a;
    width: max-content;
  }
  .cell {
    width: 28px;
    height: 28px;
    background: #05060a;
    border: 1px solid #171a24;
  }

  #preview-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  #preview-column .label {
    color: #8b8fa3;
    font-size: 11px;
    text-align: center;
  }
  #preview-canvas {
    width: 16px;
    height: 16px;
    image-rendering: pixelated;
    background: #05060a;
    border: 1px solid #2a2d3a;
  }
  /* A second, larger copy of the same 16x16 buffer — same pixels, easier to
     glance at without losing the true-size one above it. */
  #preview-canvas-4x {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    background: #05060a;
    border: 1px solid #2a2d3a;
  }

  #paint-row {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #paint-row label { color: #8b8fa3; font-size: 12px; }
  #paint-color-input {
    width: 36px;
    height: 28px;
    padding: 0;
    border: 1px solid #3d4258;
    border-radius: 4px;
    background: none;
    cursor: pointer;
  }
  #paint-hint { color: #8b8fa3; font-size: 12px; }

  #palette-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #palette-row .label { color: #8b8fa3; font-size: 12px; }
  #palette-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 1px solid #3d4258;
    cursor: pointer;
    padding: 0;
  }
  .swatch.active { border-color: #e6e6e6; box-shadow: 0 0 0 1px #e6e6e6; }

  #controls {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button.action {
    font: inherit;
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid #3d4258;
    background: #1c2030;
    color: #e6e6e6;
    cursor: pointer;
  }
  button.action:hover { background: #262b3d; }
  button.action.primary { background: #2f5fd6; border-color: #2f5fd6; }
  button.action.primary:hover { background: #3a6ce0; }
  button.action.active { background: #4a2f2f; border-color: #c76b6b; }
  #status { color: #8b8fa3; font-size: 12px; }
  #status.dirty { color: #e0b84d; }
  #status.saved { color: #57c785; }
  #status.error { color: #e05d5d; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Item icons</h1>
    <div id="sidebar-list"></div>
  </div>

  <div id="main">
    <h2 id="editor-title">Select an icon</h2>
    <div class="hint">Click, or click-drag, to paint pixels with the selected colour below.</div>

    <div id="editor">
      <div id="big-grid"></div>

      <div id="preview-column">
        <div class="label">Actual size<br>(16×16, as shown in the app)</div>
        <canvas id="preview-canvas" width="16" height="16"></canvas>
        <canvas id="preview-canvas-4x" width="16" height="16"></canvas>
      </div>
    </div>

    <div id="paint-row">
      <label for="paint-color-input">Paint colour</label>
      <input type="color" id="paint-color-input" />
      <button class="action" id="use-auto-btn" type="button">Use auto colour</button>
      <button class="action" id="eraser-btn" type="button">Eraser</button>
      <span id="paint-hint"></span>
    </div>

    <div id="palette-row">
      <span class="label">Palette</span>
      <div id="palette-swatches"></div>
    </div>

    <div id="controls">
      <button class="action primary" id="save-btn">Save to file</button>
      <button class="action" id="revert-btn">Revert</button>
      <span id="status"></span>
    </div>
  </div>

<script>
const MAX_PALETTE = 16;

const state = {
  items: [],
  grids: {}, // id -> { grid, palette }, last-saved (or loaded) state
  selectedId: null,
  currentGrid: null, // 16 rows, '.' or a hex digit indexing currentPalette
  currentPalette: null, // hex colours, index-addressable by that digit
  paintColor: "#ffffff",
  eraseMode: false,
  dirty: false,
};

const bigGridEl = document.getElementById("big-grid");
const sidebarListEl = document.getElementById("sidebar-list");
const statusEl = document.getElementById("status");
const titleEl = document.getElementById("editor-title");
const paintColorInputEl = document.getElementById("paint-color-input");
const useAutoBtn = document.getElementById("use-auto-btn");
const eraserBtn = document.getElementById("eraser-btn");
const paintHintEl = document.getElementById("paint-hint");
const paletteSwatchesEl = document.getElementById("palette-swatches");

async function load() {
  const res = await fetch("/api/icons");
  const data = await res.json();
  state.items = data.items;
  state.grids = data.grids;
  renderSidebar();
  if (state.items.length > 0) selectItem(state.items[0].id);
}

function itemById(id) {
  return state.items.find((item) => item.id === id);
}

function colorForChar(ch, palette) {
  if (ch === ".") return null;
  return palette[parseInt(ch, 16)] ?? "#ff00ff";
}

function buildGradient(ctx, stops) {
  const gradient = ctx.createLinearGradient(0, 0, 16, 16);
  const denom = stops.length > 1 ? stops.length - 1 : 1;
  stops.forEach((color, i) => gradient.addColorStop(i / denom, color));
  return gradient;
}

// `item` only contributes `.gradient` here — a set's shared visual clue
// (e.g. Prismatic's rainbow) overrides this icon's own painted colours in
// the real app, so the preview shows that too, even though the big grid
// below still lets you paint (and save) the real per-pixel colours.
function drawGrid(canvas, grid, palette, item) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, 16, 16);
  if (item.gradient && item.gradient.length > 0) {
    ctx.fillStyle = buildGradient(ctx, item.gradient);
    for (let y = 0; y < 16; y++) {
      for (let x = 0; x < 16; x++) {
        if (grid[y][x] !== ".") ctx.fillRect(x, y, 1, 1);
      }
    }
    return;
  }
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const color = colorForChar(grid[y][x], palette);
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

function renderSidebar() {
  sidebarListEl.innerHTML = "";
  for (const item of state.items) {
    const row = document.createElement("button");
    row.className = "item-row";
    row.type = "button";
    row.dataset.id = item.id;

    const canvas = document.createElement("canvas");
    canvas.width = 16;
    canvas.height = 16;
    const stored = state.grids[item.id];
    drawGrid(canvas, stored.grid, stored.palette, item);

    const label = document.createElement("span");
    label.textContent = item.name;

    row.append(canvas, label);
    row.addEventListener("click", () => selectItem(item.id));
    sidebarListEl.appendChild(row);
  }
  updateSelectedRowStyles();
}

function updateSelectedRowStyles() {
  for (const el of sidebarListEl.querySelectorAll(".item-row")) {
    el.classList.toggle("selected", el.dataset.id === state.selectedId);
  }
}

function selectItem(id) {
  if (state.dirty && !confirm("Discard unsaved changes to this icon?")) return;
  const stored = state.grids[id];
  state.selectedId = id;
  state.currentGrid = [...stored.grid];
  state.currentPalette = [...stored.palette];
  state.paintColor = stored.palette[0] ?? itemById(id).autoColor;
  state.eraseMode = false;
  state.dirty = false;
  updateSelectedRowStyles();
  titleEl.textContent = itemById(id).name;
  renderBigGrid();
  renderPreview();
  renderPaletteSwatches();
  updatePaintControls();
  setStatus("");
}

function updatePaintControls() {
  const item = itemById(state.selectedId);
  if (!item) return;
  paintColorInputEl.value = state.paintColor;
  eraserBtn.classList.toggle("active", state.eraseMode);
  paintHintEl.textContent =
    item.gradient && item.gradient.length > 0
      ? "This item is in a set with a shared gradient — the app shows that instead of whatever you paint here, but painting still saves."
      : "";
}

function renderPaletteSwatches() {
  paletteSwatchesEl.innerHTML = "";
  state.currentPalette.forEach((color) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "swatch";
    btn.style.background = color;
    btn.title = color;
    btn.classList.toggle(
      "active",
      !state.eraseMode && color.toLowerCase() === state.paintColor.toLowerCase(),
    );
    btn.addEventListener("click", () => {
      state.eraseMode = false;
      state.paintColor = color;
      updatePaintControls();
      renderPaletteSwatches();
    });
    paletteSwatchesEl.appendChild(btn);
  });
}

function renderBigGrid() {
  bigGridEl.innerHTML = "";
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.x = String(x);
      cell.dataset.y = String(y);
      const color = colorForChar(state.currentGrid[y][x], state.currentPalette);
      cell.style.background = color ?? "#05060a";
      bigGridEl.appendChild(cell);
    }
  }
}

function renderPreview() {
  const item = itemById(state.selectedId);
  drawGrid(document.getElementById("preview-canvas"), state.currentGrid, state.currentPalette, item);
  drawGrid(document.getElementById("preview-canvas-4x"), state.currentGrid, state.currentPalette, item);
  const thumb = sidebarListEl.querySelector(`.item-row[data-id="${state.selectedId}"] canvas`);
  if (thumb) drawGrid(thumb, state.currentGrid, state.currentPalette, item);
}

// Returns the grid character to paint with right now (a palette digit, or
// "." for the eraser), adding `state.paintColor` to the palette first if
// it's a new colour. Returns null if the palette is already full and the
// colour isn't in it.
function charToPaintWith() {
  if (state.eraseMode) return ".";
  const wanted = state.paintColor.toLowerCase();
  let idx = state.currentPalette.findIndex((c) => c.toLowerCase() === wanted);
  if (idx === -1) {
    if (state.currentPalette.length >= MAX_PALETTE) {
      setStatus(
        `Palette full (${MAX_PALETTE} colours) — pick an existing swatch instead.`,
        "error",
      );
      return null;
    }
    state.currentPalette = [...state.currentPalette, state.paintColor];
    idx = state.currentPalette.length - 1;
    renderPaletteSwatches();
  }
  return idx.toString(16);
}

function setCell(x, y, value) {
  const row = state.currentGrid[y];
  if (row[x] === value) return;
  state.currentGrid[y] = row.slice(0, x) + value + row.slice(x + 1);
  const idx = y * 16 + x;
  const color = colorForChar(value, state.currentPalette);
  bigGridEl.children[idx].style.background = color ?? "#05060a";
  state.dirty = true;
  renderPreview();
  setStatus("Unsaved changes", "dirty");
}

let painting = false;
let paintValue = ".";

bigGridEl.addEventListener("mousedown", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell || !state.currentGrid) return;
  const value = charToPaintWith();
  if (value === null) return;
  paintValue = value;
  painting = true;
  setCell(Number(cell.dataset.x), Number(cell.dataset.y), paintValue);
  e.preventDefault();
});
bigGridEl.addEventListener("mouseover", (e) => {
  if (!painting) return;
  const cell = e.target.closest(".cell");
  if (!cell) return;
  setCell(Number(cell.dataset.x), Number(cell.dataset.y), paintValue);
});
window.addEventListener("mouseup", () => { painting = false; });

paintColorInputEl.addEventListener("input", () => {
  state.eraseMode = false;
  state.paintColor = paintColorInputEl.value;
  updatePaintControls();
  renderPaletteSwatches();
});

useAutoBtn.addEventListener("click", () => {
  const item = itemById(state.selectedId);
  if (!item) return;
  state.eraseMode = false;
  state.paintColor = item.autoColor;
  updatePaintControls();
  renderPaletteSwatches();
});

eraserBtn.addEventListener("click", () => {
  state.eraseMode = !state.eraseMode;
  updatePaintControls();
  renderPaletteSwatches();
});

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || "";
}

document.getElementById("save-btn").addEventListener("click", async () => {
  if (!state.selectedId) return;
  setStatus("Saving...");
  try {
    const res = await fetch(`/api/icons/${encodeURIComponent(state.selectedId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ grid: state.currentGrid, palette: state.currentPalette }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    state.grids[state.selectedId] = {
      grid: [...state.currentGrid],
      palette: [...state.currentPalette],
    };
    state.dirty = false;
    setStatus("Saved — the app will pick this up automatically", "saved");
  } catch (err) {
    setStatus(`Error: ${err.message}`, "error");
  }
});

document.getElementById("revert-btn").addEventListener("click", () => {
  if (!state.selectedId) return;
  const stored = state.grids[state.selectedId];
  state.currentGrid = [...stored.grid];
  state.currentPalette = [...stored.palette];
  state.paintColor = stored.palette[0] ?? itemById(state.selectedId).autoColor;
  state.eraseMode = false;
  state.dirty = false;
  renderBigGrid();
  renderPreview();
  renderPaletteSwatches();
  updatePaintControls();
  setStatus("");
});

load();
</script>
</body>
</html>
