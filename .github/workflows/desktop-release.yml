name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

jobs:
  check-release-notes:
    name: Check release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify curated notes exist for this version
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version packages/desktop/src-tauri/tauri.conf.json)
          jq -e --arg v "$VERSION" \
            '[.[] | select(.version == $v) | .highlights[]?] | length > 0' \
            packages/desktop/release-notes.json > /dev/null \
            || { echo "::error::No curated release notes for version $VERSION in packages/desktop/release-notes.json. Add an entry with a non-empty \"highlights\" array before tagging (see packages/desktop/README.md#releasing)."; exit 1; }

  build-macos:
    name: Build macOS
    needs: check-release-notes
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @herzies/shared build

      - name: Import signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Inspect signing identities
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "=== Codesigning identities in temp keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          echo ""
          echo "=== Codesigning identities across all search list ==="
          security find-identity -v -p codesigning || true
          echo ""
          echo "=== Match check for APPLE_SIGNING_IDENTITY ==="
          security find-identity -v -p codesigning -s "$APPLE_SIGNING_IDENTITY" "$KEYCHAIN_PATH" || true
          echo ""
          echo "Length of APPLE_SIGNING_IDENTITY secret: ${#APPLE_SIGNING_IDENTITY}"

      - name: Build universal binary
        working-directory: packages/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_APP_NAME: ${{ secrets.LASTFM_APP_NAME }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Notarize
        if: env.HAS_APPLE_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          SUBMIT_JSON=$(mktemp)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$SUBMIT_JSON"
          cat "$SUBMIT_JSON"
          STATUS=$(jq -r '.status' "$SUBMIT_JSON")
          SUBMISSION_ID=$(jq -r '.id' "$SUBMIT_JSON")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi
          xcrun stapler staple "$DMG"

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG=$(find packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          TARGZ=$(find packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app.tar.gz' | head -1)
          cp "$DMG" dist/
          cp "$TARGZ" dist/
          cp "${TARGZ}.sig" dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*

  build-windows:
    name: Build Windows
    needs: check-release-notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @herzies/shared build

      # No Windows code-signing certificate yet — the NSIS installer ships
      # unsigned for now (SmartScreen will warn on install/update until one
      # is added). Tauri's updater signature (TAURI_SIGNING_PRIVATE_KEY)
      # still applies so auto-update integrity checks keep working.
      - name: Build installer
        working-directory: packages/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_APP_NAME: ${{ secrets.LASTFM_APP_NAME }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          EXE=$(find packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name '*.exe' | head -1)
          cp "$EXE" dist/
          cp "${EXE}.sig" dist/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*

  publish:
    name: Publish release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version packages/desktop/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Written to a file rather than a step output: curated prose can contain
      # quotes, backticks or `$` that would corrupt later `run:` scripts if
      # interpolated as a string. Every step below that needs the notes reads
      # this file instead.
      - name: Extract curated release notes
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          jq -r --arg v "$VERSION" \
            '.[] | select(.version == $v) | .highlights | map("- " + .) | join("\n")' \
            packages/desktop/release-notes.json > release-notes-body.txt
          cat release-notes-body.txt

      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      # Assembled here — not in the per-OS build jobs — because latest.json
      # is a single shared file at the live updater endpoint
      # (releases/latest/download/latest.json); two independent jobs each
      # writing their own copy would race and clobber each other's platform
      # entries. This is the only job that produces it.
      - name: Build updater manifest
        id: manifest
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}

          MAC_TARGZ=$(find artifacts/macos -name '*.app.tar.gz' | head -1)
          MAC_SIG=$(cat "${MAC_TARGZ}.sig")
          MAC_URL="https://github.com/Herzies/herzies/releases/download/desktop-v${VERSION}/$(basename "$MAC_TARGZ")"

          WIN_EXE=$(find artifacts/windows -name '*.exe' | head -1)
          WIN_SIG=$(cat "${WIN_EXE}.sig")
          WIN_URL="https://github.com/Herzies/herzies/releases/download/desktop-v${VERSION}/$(basename "$WIN_EXE")"

          # Universal macOS binary: both architectures point at the same .app.tar.gz.
          # --rawfile (not --arg) so the curated notes reach jq as file content,
          # never interpolated into the shell script.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes release-notes-body.txt \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "$MAC_URL" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "$WIN_URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64":  { signature: $mac_sig, url: $mac_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create "desktop-v${VERSION}" \
            artifacts/macos/*.dmg \
            artifacts/macos/*.app.tar.gz \
            artifacts/macos/*.app.tar.gz.sig \
            artifacts/windows/*.exe \
            artifacts/windows/*.exe.sig \
            latest.json \
            --title "Herzies Desktop v${VERSION}" \
            --notes-file release-notes-body.txt \
            --target main
